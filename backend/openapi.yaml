openapi: 3.1.0
info:
  title: Ambience API
  version: 0.1.0
paths:
  /ambiences:
    post:
      tags:
      - ambiences
      summary: Create Ambience
      operationId: create_ambience_ambiences_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbienceRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ambience'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Ambience:
      properties:
        uuid:
          type: string
          title: Uuid
        user_id:
          type: string
          title: User Id
        prompt:
          type: string
          title: Prompt
        fingerprint:
          type: string
          title: Fingerprint
        created_at:
          type: string
          format: date-time
          title: Created At
        name:
          type: string
          title: Name
        intension:
          type: string
          title: Intension
        publico:
          type: string
          title: Publico
        shuffle_rule:
          type: boolean
          title: Shuffle Rule
        filters:
          items:
            $ref: '#/components/schemas/Filter'
          type: array
          title: Filters
      type: object
      required:
      - uuid
      - user_id
      - prompt
      - fingerprint
      - created_at
      - name
      - intension
      - publico
      - shuffle_rule
      - filters
      title: Ambience
    AmbienceRequest:
      properties:
        prompt:
          type: string
          maxLength: 2000
          minLength: 3
          title: Prompt
        user_id:
          type: string
          minLength: 1
          title: User Id
      type: object
      required:
      - prompt
      - user_id
      title: AmbienceRequest
    Filter:
      properties:
        shuffle_rule:
          type: boolean
          title: Shuffle Rule
          default: false
        genres:
          items:
            type: string
          type: array
          title: Genres
        moods:
          items:
            type: string
          type: array
          title: Moods
        album_release_dates:
          items:
            type: string
          type: array
          title: Album Release Dates
        artist_origin_regions:
          items:
            type: string
          type: array
          title: Artist Origin Regions
        artist_origin_countries:
          items:
            type: string
          type: array
          title: Artist Origin Countries
        explicit:
          type: boolean
          title: Explicit
          default: false
        tracks_exceptions:
          items:
            type: string
          type: array
          title: Tracks Exceptions
        popularity:
          $ref: '#/components/schemas/Range'
        acousticness:
          $ref: '#/components/schemas/Range'
        danceability:
          $ref: '#/components/schemas/Range'
        energy:
          $ref: '#/components/schemas/Range'
        instrumentalness:
          $ref: '#/components/schemas/Range'
        liveness:
          $ref: '#/components/schemas/Range'
        loudness:
          $ref: '#/components/schemas/Range'
        speechiness:
          $ref: '#/components/schemas/Range'
        tempo:
          $ref: '#/components/schemas/Range'
        valence:
          $ref: '#/components/schemas/Range'
      type: object
      title: Filter
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Range:
      properties:
        min:
          anyOf:
          - type: number
          - type: 'null'
          title: Min
        max:
          anyOf:
          - type: number
          - type: 'null'
          title: Max
      type: object
      title: Range
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
